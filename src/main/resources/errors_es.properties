# Mensajes de error por codigo (es).

REQUEST-001=La validación de la petición falló
REQUEST-002=No se pudo interpretar el cuerpo de la petición

USER-001=Formato de correo inválido: {email}
USER-002=Ya existe un usuario con ese nombre o correo
USER-003=El usuario {userId} no existe

AUTH-001=Credenciales inválidas
AUTH-002=Esta cuenta está baneada
AUTH-003=La contraseña debe tener entre {minLength} y {maxLength} caracteres e incluir letras y dígitos
AUTH-004=El usuario {userId} no tiene credencial registrada

AUTHZ-001=No tienes el permiso {permission}
AUTHZ-002=Esta operación requiere iniciar sesión

LEVEL-001=El nivel {levelId} no existe
LEVEL-002=El nombre del nivel debe tener entre {minLength} y {maxLength} caracteres
LEVEL-003=La dificultad {difficultyId} no existe
LEVEL-004=La versión {versionId} no existe
LEVEL-005=Número de versión inválido: {versionNumber}
LEVEL-006=El usuario {userId} no es miembro del nivel {levelId}
LEVEL-007=No se puede publicar un nivel sin una versión subida
LEVEL-008=Un nivel publicado debe tener fecha de publicación
LEVEL-009=No tienes el permiso {permission} sobre este nivel
LEVEL-010=Ese usuario ya es miembro del nivel
LEVEL-011=El dueño del nivel no se puede modificar ni eliminar
LEVEL-012=Los datos del nivel no pueden estar vacíos
LEVEL-013=Los datos del nivel superan el límite de {maxBytes} bytes

SONG-001=La canción {songId} no existe
