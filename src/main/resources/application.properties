quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=postgres
quarkus.datasource.password=postgres
quarkus.datasource.jdbc.url=jdbc:postgresql://127.0.0.1:5432/hexarch


quarkus.liquibase.migrate-at-start=true
quarkus.liquibase.change-log=db/changeLog.xml

# Firma simetrica HS256: el secreto de dev se sobreescribe con la variable JWT_SECRET en cualquier otro entorno.
hexarch.jwt.issuer=https://hexarch.org/issuer
hexarch.jwt.secret=${JWT_SECRET:dev-only-secret-change-me-32-bytes-minimum}
hexarch.jwt.expiration-seconds=3600

mp.jwt.verify.issuer=${hexarch.jwt.issuer}
smallrye.jwt.verify.algorithm=HS256
smallrye.jwt.verify.secretkey=${hexarch.jwt.secret}
# Tambien desactiva la generacion automatica de claves RSA en dev/test.
smallrye.jwt.sign.key=${hexarch.jwt.secret}
