quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=postgres
quarkus.datasource.password=postgres
quarkus.datasource.jdbc.url=jdbc:postgresql://127.0.0.1:5432/hexarch


quarkus.liquibase.migrate-at-start=true
quarkus.liquibase.change-log=db/changeLog.xml

# Tope explicito del cuerpo: el binario de un nivel viaja en base64, que infla un 33%.
# Con 8 MiB de tope para levelData, 16M deja margen para el sobre JSON.
quarkus.http.limits.max-body-size=${HTTP_MAX_BODY_SIZE:16M}

# RS256 (algoritmo por defecto de MP-JWT). En dev/test Quarkus genera el par RSA al vuelo
# porque no hay clave de verificacion configurada; en produccion hay que apuntar a los ficheros.
hexarch.jwt.issuer=https://hexarch.org/issuer
hexarch.jwt.expiration-seconds=3600

mp.jwt.verify.issuer=${hexarch.jwt.issuer}
%prod.smallrye.jwt.sign.key.location=${JWT_PRIVATE_KEY_LOCATION:privateKey.pem}
%prod.mp.jwt.verify.publickey.location=${JWT_PUBLIC_KEY_LOCATION:publicKey.pem}
